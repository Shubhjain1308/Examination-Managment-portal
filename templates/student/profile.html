{% extends "base.html" %}

{% block content %}

<h3>My Profile</h3>

<form method="post" class="card card-body col-md-5">

  <label>Email (cannot be changed)</label>
  <input class="form-control mb-3" value="{{ current_user.email }}" disabled>

  <label>Name</label>
  <input class="form-control mb-3" name="name" value="{{ current_user.name }}" required>

  <label>Roll number</label>
  <input class="form-control mb-3" name="roll_no" value="{{ current_user.roll_no or '' }}">

  <label>Contact number</label>
  <input class="form-control mb-3" name="contact" value="{{ current_user.contact or '' }}">

  <label>New password (leave empty to keep the old one)</label>
  <input class="form-control mb-3" type="password" name="password">

  <button class="btn btn-primary">Update</button>

</form>

{% endblock %}
