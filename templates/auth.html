{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">

    <!-- ============ LOGIN PAGE ============ -->
    {% if mode == 'login' %}

      <h3>Login</h3>

      <form method="post" class="card card-body">

        <label>Email</label>
        <input class="form-control mb-3" type="email" name="email" required>

        <label>Password</label>
        <input class="form-control mb-3" type="password" name="password" required>

        <button class="btn btn-primary">Login</button>
      </form>

      <p class="mt-3">
        New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
      </p>

    {% endif %}


    <!-- ============ REGISTER PAGE ============ -->
    {% if mode == 'register' %}

      <h3>Register</h3>

      <form method="post" class="card card-body">

        <label>Register as</label>
        <select class="form-select mb-3" name="role">
          <option value="student">Student</option>
          <option value="examiner">Examiner</option>
        </select>

        <label>Name</label>
        <input class="form-control mb-3" name="name" required>

        <label>Email</label>
        <input class="form-control mb-3" type="email" name="email" required>

        <label>Password (at least 6 characters)</label>
        <input class="form-control mb-3" type="password" name="password" minlength="6" required>

        <label>Contact number</label>
        <input class="form-control mb-3" name="contact">

        <label>Roll number (students only)</label>
        <input class="form-control mb-3" name="roll_no">

        <label>Department (examiners only)</label>
        <input class="form-control mb-3" name="department">

        <button class="btn btn-primary">Register</button>
      </form>

      <p class="mt-3">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
      </p>

    {% endif %}

  </div>
</div>
{% endblock %}
